<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MaleCNS · Circuit atlas</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/atlas.css"></head>
<body class="atlas-page">
<header><div class="brand"><span class="mark">m</span> MaleCNS <span class="muted">/ circuit atlas</span></div><nav class="toplinks"><a href="/">Motion lab</a><a href="/learning">Odor learning</a><a href="/vision">Vision network</a><a href="/neuron">Neuron workbench</a><a href="/explore">Neuron explorer</a><a href="/numerosity">Numerosity</a><a href="/math">Math classroom</a><a href="/regions">Brain regions</a><a href="/3d">3D</a><a href="/expansion">Sparse expansion</a></nav></header>
<div class="atlas-bar">
  <nav id="crumbs" aria-label="Location in circuit"></nav>
  <div class="views" role="group" aria-label="View">
    <button class="secondary" id="vWiring" aria-pressed="true">Wiring</button>
    <button class="secondary" id="vAnatomy" aria-pressed="false">Anatomy</button>
  </div>
  <div class="tools" id="tools" hidden>
    <button class="secondary" id="regionBtn" aria-pressed="false" title="Drag a rectangle to summarize a region. Shift-drag also works.">Select region</button>
    <label class="thresh">Show edges ≥ <output id="threshOut">off</output> synapses<input id="thresh" type="range" min="0" max="300" step="10" value="0"></label>
    <button class="secondary" id="resetBtn">Reset view</button>
  </div>
</div>
<div class="atlas-body">
  <section class="atlas-stage" id="stage">
    <canvas id="map" aria-label="Circuit map. Use the side panel lists for keyboard navigation."></canvas>
    <div id="tip" class="tip" hidden></div>
    <p class="stage-hint" id="hint"></p>
  </section>
  <aside id="panel" class="atlas-panel" aria-live="polite"><p>Reading circuit…</p></aside>
</div>
<script src="/ng.js"></script><script src="/atlas-core.js"></script>
<script src="/atlas.js"></script>
</body></html>
